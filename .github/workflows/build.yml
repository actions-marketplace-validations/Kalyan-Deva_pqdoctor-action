# Builds the pqdoctor release binaries from the published crate (crates.io), so anyone can check
# them against that source: Linux static musl (x64, arm64), macOS universal (arm64 + x86_64) and
# Windows x64. Each file gets a build provenance attestation; the release holds SHA256SUMS.txt.
# The same files are served from https://pqdoctor.com/downloads/v<version>/, which the action uses.
name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: pqdoctor version on crates.io
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, asset: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: linux-arm64 }
          - { os: macos-15, target: universal, asset: macos-universal }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, asset: windows-x64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      V: ${{ inputs.version }}
      # The release profile of pqdoctor's own workspace (cargo install from a crate doesn't read it).
      CARGO_PROFILE_RELEASE_OPT_LEVEL: s
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_PANIC: abort
      CARGO_PROFILE_RELEASE_STRIP: "true"
    steps:
      - name: Toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update && rustup default stable
          if [ "${{ matrix.target }}" = universal ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; else rustup target add ${{ matrix.target }}; fi
          if [ "${{ runner.os }}" = Linux ]; then sudo apt-get update -q && sudo apt-get install -yq musl-tools; fi
      - name: Build from crates.io
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = universal ]; then
            for t in aarch64-apple-darwin x86_64-apple-darwin; do
              MACOSX_DEPLOYMENT_TARGET=11.0 cargo install pqdoctor --version "$V" --locked --target $t --root "out-$t"
            done
            lipo -create -output pqdoctor out-aarch64-apple-darwin/bin/pqdoctor out-x86_64-apple-darwin/bin/pqdoctor
            codesign --force --sign - pqdoctor
            lipo -info pqdoctor
          else
            cargo install pqdoctor --version "$V" --locked --target ${{ matrix.target }} --root out
            cp out/bin/pqdoctor* .
          fi
      - name: Smoke test
        shell: bash
        run: ./pqdoctor --version
      - name: Package
        shell: bash
        run: |
          curl -fsSL "https://static.crates.io/crates/pqdoctor/pqdoctor-$V.crate" | tar xz
          mkdir dist
          if [ "${{ runner.os }}" = Windows ]; then
            cp pqdoctor.exe "dist/pqdoctor-$V-windows-x64.exe"
          else
            n="pqdoctor-$V-${{ matrix.asset }}"
            mkdir "$n" && cp pqdoctor "pqdoctor-$V/README.md" "pqdoctor-$V/LICENSE" "$n/"
            tar czf "dist/$n.tar.gz" "$n"
          fi
          ls -l dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "pqdoctor-v${{ inputs.version }}" dist/* --repo "$GITHUB_REPOSITORY" --title "pqdoctor ${{ inputs.version }} binaries" --notes "Built from https://crates.io/crates/pqdoctor/${{ inputs.version }} by the build workflow. Verify with \`sha256sum -c SHA256SUMS.txt\` or \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
